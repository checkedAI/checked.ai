<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Checked AI - Offline</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #0A1128;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(79, 70, 229, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #A5B4FC;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #FFFFFF;
      margin: 0 0 12px;
    }
    p {
      font-size: 14px;
      color: #94A3B8;
      max-width: 320px;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    button {
      background: #4F46E5;
      color: #FFFFFF;
      border: none;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
  </style>
</head>
<body>
  <div class="badge">Checked AI · Offline Mode</div>
  <h1>Connection Required</h1>
  <p>Checked AI requires an active internet connection to evaluate AI generation markers and threat signals.</p>
  <button onclick="window.location.href='https://checked-ai.ai.studio'">Retry Connection</button>
</body>
</html>
